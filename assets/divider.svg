<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="760" height="44" viewBox="0 0 760 44" role="presentation">
  <path id="wave"
        d="M0,22 C63,6 127,6 190,22 S317,38 380,22 S507,6 570,22 S697,38 760,22"
        fill="none" stroke="#3D3428" stroke-width="1.5"/>

  <g fill="none" stroke="#E8B44A" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7,0 q3.5,-4.5 7,0 q3.5,-4.5 7,0">
      <animateMotion dur="11s" repeatCount="indefinite" rotate="auto">
        <mpath xlink:href="#wave"/>
      </animateMotion>
      <animate attributeName="stroke-opacity"
               values="0;1;1;1;0"
               keyTimes="0;0.06;0.5;0.94;1"
               dur="11s"
               repeatCount="indefinite"/>
    </path>
  </g>
</svg>
