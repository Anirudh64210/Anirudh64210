<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-label="Sai Anirudh Siddi">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="scanlines" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="#000000" opacity="0.28"/>
    </pattern>

    <clipPath id="reveal">
      <rect x="118" y="30" height="90" width="0">
        <animate attributeName="width"
                 values="0;530;530"
                 keyTimes="0;0.26;1"
                 dur="9s"
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="760" height="150" rx="6" fill="#14110E"/>
  <rect x="0.5" y="0.5" width="759" height="149" rx="6" fill="none" stroke="#3D3428"/>

  <g filter="url(#glow)">
    <text x="380" y="90"
          clip-path="url(#reveal)"
          text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="42"
          letter-spacing="5"
          fill="#E8B44A">SAI ANIRUDH SIDDI</text>

    <rect y="52" width="17" height="46" fill="#E8B44A">
      <animate attributeName="x"
               values="120;650;650"
               keyTimes="0;0.26;1"
               dur="9s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="1;1;0;1"
               keyTimes="0;0.5;0.75;1"
               dur="1.1s"
               repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="380" y="122"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13"
        letter-spacing="3"
        fill="#8C7A5E">las vegas, nv</text>

  <rect width="760" height="150" rx="6" fill="url(#scanlines)"/>

  <rect width="760" height="150" rx="6" fill="#E8B44A" opacity="0.03">
    <animate attributeName="opacity"
             values="0.03;0.06;0.02;0.05;0.03"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>
</svg>
