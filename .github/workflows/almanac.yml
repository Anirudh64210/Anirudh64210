name: keep the almanac

on:
  schedule:
    # every four hours, off the top of the hour -- github drops scheduled
    # runs queued at :00 when the fleet is busy
    - cron: "23 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: almanac
  cancel-in-progress: false

jobs:
  almanac:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: render the almanac
        env:
          # ALMANAC_TOKEN is a personal access token with read:user scope.
          # Set it to include private contributions; without it this falls
          # back to public-only numbers.
          GITHUB_TOKEN: ${{ secrets.ALMANAC_TOKEN || secrets.GITHUB_TOKEN }}
          ALMANAC_USER: ${{ github.repository_owner }}
        run: python3 scripts/almanac.py

      - name: commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "tend the almanac"
          # someone may have pushed while we were rendering
          git pull --rebase --autostash origin main
          git push
