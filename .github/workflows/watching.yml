name: what i am watching

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/watching/**"
      - "scripts/watching.py"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - run: pip install pillow

      - run: python3 scripts/watching.py

      - name: commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/watching.gif
          git diff --staged --quiet || git commit -m "rebuild the tv"
          git push
